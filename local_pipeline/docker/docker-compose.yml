version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: sgx_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: sgx_minio
    ports:
      - "9000:9000"
      - "9001:9001" # Expose thêm port Console để quản lý giao diện trực quan
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    restart: unless-stopped

  airflow-init:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: sgx_airflow_init
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: >
      bash -c "airflow db migrate &&
      airflow users create -u admin -p admin -f Admin -l User -r Admin -e admin@example.com"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: sgx_airflow_webserver
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../:/opt/airflow/workspace
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=sgx-lakehouse
      - POSTGRES_HOST=postgres
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: sgx_airflow_scheduler
    volumes:
      - ../dags:/opt/airflow/dags
      - ../:/opt/airflow/workspace
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=sgx-lakehouse
      - POSTGRES_HOST=postgres
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

#  grafana:
#    image: grafana/grafana:latest
#    container_name: sgx_grafana
#    ports:
#      - "3000:3000"
#    volumes:
#      - grafana_data:/var/lib/grafana
#    depends_on:
#      - postgres
#    restart: unless-stopped

  pdc-agent:
    image: grafana/pdc-agent:latest
    container_name: sgx_pdc_agent
    environment:
      - PDC_AGENT_TOKEN=${GRAFANA_PDC_TOKEN}
      - PDC_AGENT_CLUSTER=${PDC_AGENT_CLUSTER}
      - PDC_AGENT_GCLOUD_HOSTED_GRAFANA_ID=${GRAFANA_HOSTED_ID}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
#  grafana_data:
#    driver: local
